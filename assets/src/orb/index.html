<!doctype html>
<meta charset="utf-8">
<title>orb</title>
<style>html,body{margin:0;background:#0d1117}canvas{display:block}</style>
<canvas id="out"></canvas>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js';

const W = 1000, H = 240, S = 2;           // hero size and pixel scale
const ORB = 300;                           // orb canvas size (css px), centred at (800,120)
const FPS = 24, SECONDS = 6, N = FPS * SECONDS;
const q = new URLSearchParams(location.search);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(S);
renderer.setSize(ORB, ORB, false);
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const material = new THREE.ShaderMaterial({
  transparent: true,
  uniforms: { uPhase: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position, 1.0); }`,
  fragmentShader: `
    precision highp float;
    varying vec2 vUv;
    uniform float uPhase;            // 0..2π over one loop
    const float R = 0.56;            // orb radius in uv space (canvas spans -1..1)

    // periodic 3D value noise: time enters only through sin/cos(uPhase), so the loop is seamless
    float hash(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
    float noise(vec3 x){
      vec3 i = floor(x), f = fract(x); f = f*f*(3.0-2.0*f);
      return mix(mix(mix(hash(i), hash(i+vec3(1,0,0)), f.x), mix(hash(i+vec3(0,1,0)), hash(i+vec3(1,1,0)), f.x), f.y),
                 mix(mix(hash(i+vec3(0,0,1)), hash(i+vec3(1,0,1)), f.x), mix(hash(i+vec3(0,1,1)), hash(i+vec3(1,1,1)), f.x), f.y), f.z);
    }
    float fbm(vec3 p){ float a = 0.55, s = 0.0; for (int i = 0; i < 3; i++){ s += a*noise(p); p *= 2.0; a *= 0.45; } return s / 0.95; }

    void main(){
      vec2 p = vUv * 2.0 - 1.0;
      float d = length(p);
      vec3 blue = vec3(0.24, 0.55, 1.0), iris = vec3(0.58, 0.47, 1.0),
           aqua = vec3(0.25, 0.92, 0.86), rose = vec3(1.0, 0.50, 0.75), ink = vec3(0.10, 0.16, 0.42);

      // bloom outside the orb, breathing like speech
      float breath = 0.5 + 0.5*sin(uPhase*2.0) * (0.6 + 0.4*sin(uPhase*3.0));
      float g = exp(-max(d - R, 0.0) * (7.5 - 2.0*breath));
      vec3 bloom = mix(blue, iris, 0.5 + 0.5*sin(uPhase + atan(p.y, p.x))) * g * (0.55 + 0.25*breath);

      // sphere geometry
      vec2 sp = p / R;
      float r2 = dot(sp, sp);
      float z = sqrt(max(1.0 - r2, 0.0));
      vec3 n = normalize(vec3(sp, z));

      // large, slow colour fields: low-frequency warped noise on the sphere
      vec3 t = vec3(cos(uPhase), sin(uPhase), cos(uPhase*2.0)*0.5) * 0.7;
      vec3 q0 = n * 0.9 + t;
      vec3 w = vec3(fbm(q0 + vec3(0.0, 0.0, 1.7)), fbm(q0 + vec3(5.2, 1.3, 0.0)), fbm(q0 + vec3(2.1, 7.4, 3.3)));
      float f = fbm(n * 1.1 + 1.6 * w - t.yxz);

      vec3 col = mix(ink, blue, smoothstep(0.2, 0.55, f));
      col = mix(col, iris, smoothstep(0.42, 0.7, w.x));
      col = mix(col, aqua, smoothstep(0.5, 0.78, w.y) * (0.55 + 0.45*smoothstep(0.3, -0.6, n.y)));
      col = mix(col, rose, smoothstep(0.6, 0.85, w.z) * 0.5);
      col *= 0.85 + 0.45 * f;

      // lighting: key light from upper left, glowing fresnel rim, gentle edge depth
      vec3 L = normalize(vec3(-0.6, 0.7, 0.6));
      float fres = pow(1.0 - z, 2.2);
      col *= 0.75 + 0.35 * max(dot(n, L), 0.0);
      col *= mix(1.0, 0.8, smoothstep(0.85, 1.0, r2));
      col += fres * mix(blue, iris, 0.5 + 0.5*n.x) * (1.0 + 0.4*breath);
      col += pow(max(-n.y, 0.0), 3.0) * aqua * 0.3;

      // specular: wide soft sheen and a small, soft glint
      vec3 H = normalize(L + vec3(0, 0, 1));
      float nh = max(dot(n, H), 0.0);
      col += vec3(1.0) * (pow(nh, 140.0) * 0.55 + pow(nh, 10.0) * 0.14);

      // blend orb over bloom with an anti-aliased edge (no dark seam)
      float edge = smoothstep(R + 0.006, R - 0.006, d);
      vec3 rgb = mix(bloom, col, edge);
      float a = max(edge, clamp(max(max(bloom.r, bloom.g), bloom.b), 0.0, 1.0));
      gl_FragColor = vec4(rgb, a);
    }`,
});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

// composite: background + text (2D canvas) + orb (WebGL)
const out = document.getElementById('out');
out.width = W * S; out.height = H * S; out.style.width = W + 'px';
const ctx = out.getContext('2d');
const sans = '-apple-system, "Segoe UI", Helvetica, Arial, sans-serif';
const mono = 'SFMono-Regular, Menlo, Consolas, monospace';
const captions = [
  ['● listening…  (speech → text)', '#3fb950'],
  ['● thinking…   (LLM → plan)', '#3987e5'],
  ['● acting…     (tools → result)', '#d2a8ff'],
];

function draw(frame) {
  const phase = (frame / N) * Math.PI * 2;
  material.uniforms.uPhase.value = phase;
  renderer.render(scene, camera);

  ctx.setTransform(S, 0, 0, S, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#0d1117';
  ctx.beginPath(); ctx.roundRect(0, 0, W, H, 12); ctx.fill();

  ctx.fillStyle = '#f0f6fc'; ctx.font = `700 40px ${sans}`; ctx.fillText('Jashanprit Singh', 48, 104);
  ctx.fillStyle = '#9198a1'; ctx.font = `500 17px ${sans}`;
  ctx.fillText('AI Engineer · I build AI systems that listen, think and act', 48, 138);

  // caption: 2 s each, with a short cross-fade
  const sec = frame / FPS, i = Math.floor(sec / 2) % 3, local = sec % 2;
  const alpha = Math.min(1, local / 0.15, (2 - local) / 0.15);
  ctx.globalAlpha = alpha; ctx.fillStyle = captions[i][1]; ctx.font = `500 13px ${mono}`;
  ctx.fillText(captions[i][0], 48, 178);
  ctx.globalAlpha = 1;

  ctx.drawImage(renderer.domElement, 800 - ORB / 2, 120 - ORB / 2, ORB, ORB);
}

async function capture() {
  for (let f = 0; f < N; f++) {
    draw(f);
    const blob = await new Promise(r => out.toBlob(r, 'image/png'));
    await fetch(`/frames/${String(f).padStart(4, '0')}.png`, { method: 'POST', body: blob });
  }
  document.title = 'done';
}

if (q.has('capture')) capture();
else if (q.has('t')) { draw(Math.round(parseFloat(q.get('t')) * FPS) % N); document.title = 'frame'; }
else { let f = 0; (function loop(){ draw(f = (f + 1) % N); setTimeout(loop, 1000 / FPS); })(); }
</script>
