<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="t d">
  <title id="t">Jashanprit Singh, AI Engineer</title>
  <desc id="d">An animated voice orb with swirling light and ripples, while a caption cycles through listening, thinking and acting.</desc>
  <style>
    .name { font: 700 40px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .role { font: 500 17px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9198a1; }
    .mono { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <defs>
    <radialGradient id="glow">
      <stop offset="0.55" stop-color="#3987e5" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3987e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#1d2b4f"/>
      <stop offset="1" stop-color="#0a1024"/>
    </radialGradient>
    <radialGradient id="rim" r="0.5">
      <stop offset="0.82" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#bcd4ff" stop-opacity="0.35"/>
    </radialGradient>
    <radialGradient id="shine" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="orb"><circle cx="800" cy="120" r="78">
      <animate attributeName="r" values="78;82;77;81;78" dur="3s" repeatCount="indefinite"/></circle></clipPath>
  </defs>
  <rect width="1000" height="240" rx="12" fill="#0d1117"/>

  <text x="48" y="104" class="name">Jashanprit Singh</text>
  <text x="48" y="138" class="role">AI Engineer · I build AI systems that listen, think and act</text>

  <!-- caption cycles: listening → thinking → acting (6 s loop) -->
  <g class="mono">
    <text x="48" y="178" fill="#3fb950" opacity="0">● listening…  (speech → text)
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.3;0.33;0.66;0.97;0.99;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="48" y="178" fill="#3987e5" opacity="0">● thinking…   (LLM → plan)
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.34;0.64;0.67;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="48" y="178" fill="#d2a8ff" opacity="0">● acting…     (tools → result)
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.68;0.97;1" dur="6s" repeatCount="indefinite"/></text>
  </g>

  <!-- outer glow, breathing -->
  <circle cx="800" cy="120" r="108" fill="url(#glow)">
    <animate attributeName="r" values="100;114;104;112;100" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.8;1;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- ripple rings: the orb is speaking -->
  <g fill="none" stroke="#7fa8ff" stroke-width="1.5">
    <circle cx="800" cy="120" r="80" opacity="0">
      <animate attributeName="r" values="80;116" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="120" r="80" opacity="0">
      <animate attributeName="r" values="80;116" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="800" cy="120" r="80" opacity="0">
      <animate attributeName="r" values="80;116" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="3s" begin="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- orb body: blurred colour blobs swirling at different speeds inside a clipped sphere -->
  <g clip-path="url(#orb)">
    <rect x="700" y="20" width="200" height="200" fill="url(#core)"/>
    <g filter="url(#blur)">
      <g><animateTransform attributeName="transform" type="rotate" from="0 800 120" to="360 800 120" dur="7s" repeatCount="indefinite"/>
        <ellipse cx="770" cy="100" rx="58" ry="40" fill="#3987e5"/></g>
      <g><animateTransform attributeName="transform" type="rotate" from="360 800 120" to="0 800 120" dur="9s" repeatCount="indefinite"/>
        <ellipse cx="835" cy="140" rx="50" ry="36" fill="#9085e9"/></g>
      <g><animateTransform attributeName="transform" type="rotate" from="120 800 120" to="480 800 120" dur="12s" repeatCount="indefinite"/>
        <ellipse cx="800" cy="168" rx="44" ry="26" fill="#2bd4c4" opacity="0.85"/></g>
      <g><animateTransform attributeName="transform" type="rotate" from="200 800 120" to="-160 800 120" dur="5s" repeatCount="indefinite"/>
        <circle cx="820" cy="90" r="22" fill="#e87ba4" opacity="0.6"/></g>
    </g>
    <circle cx="800" cy="120" r="82" fill="url(#rim)"/>
    <ellipse cx="776" cy="86" rx="30" ry="16" fill="url(#shine)" transform="rotate(-25 776 86)"/>
  </g>
</svg>
