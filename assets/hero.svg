<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-labelledby="t d">
  <title id="t">Jashanprit Singh, AI Engineer</title>
  <desc id="d">An animated voice waveform, while a caption cycles through listening, thinking and acting.</desc>
  <style>
    .name { font: 700 40px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f0f6fc; }
    .role { font: 500 17px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9198a1; }
    .mono { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="610" y1="0" x2="933" y2="0">
      <stop offset="0" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#9085e9"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="240" rx="12" fill="#0d1117"/>

  <text x="48" y="104" class="name">Jashanprit Singh</text>
  <text x="48" y="138" class="role">AI Engineer · I build AI systems that listen, think and act</text>

  <!-- caption cycles: listening → thinking → acting (6 s loop) -->
  <g class="mono">
    <text x="48" y="178" fill="#3fb950" opacity="0">● listening…  (speech → text)
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;0.3;0.33;0.66;0.97;0.99;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="48" y="178" fill="#3987e5" opacity="0">● thinking…   (LLM → plan)
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.34;0.64;0.67;1" dur="6s" repeatCount="indefinite"/></text>
    <text x="48" y="178" fill="#d2a8ff" opacity="0">● acting…     (tools → result)
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.68;0.97;1" dur="6s" repeatCount="indefinite"/></text>
  </g>

  <!-- waveform: 24 bars centred on y=120 -->
  <g fill="url(#g)">
    <rect x="610" y="110" width="8" height="20" rx="4"><animate attributeName="height" values="20;60;24;44;20" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="110;90;108;98;110" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="625" y="105" width="8" height="30" rx="4"><animate attributeName="height" values="30;90;40;70;30" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="105;75;100;85;105" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="640" y="100" width="8" height="40" rx="4"><animate attributeName="height" values="40;120;56;100;40" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="100;60;92;70;100" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="655" y="95" width="8" height="50" rx="4"><animate attributeName="height" values="50;150;70;130;50" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="95;45;85;55;95" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="670" y="105" width="8" height="30" rx="4"><animate attributeName="height" values="30;100;36;80;30" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="105;70;102;80;105" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="685" y="90" width="8" height="60" rx="4"><animate attributeName="height" values="60;170;80;140;60" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="90;35;80;50;90" dur="1.0s" repeatCount="indefinite"/></rect>
    <rect x="700" y="100" width="8" height="40" rx="4"><animate attributeName="height" values="40;130;50;110;40" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="100;55;95;65;100" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="715" y="108" width="8" height="24" rx="4"><animate attributeName="height" values="24;80;30;60;24" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="108;80;105;90;108" dur="1.6s" repeatCount="indefinite"/></rect>
    <rect x="730" y="95" width="8" height="50" rx="4"><animate attributeName="height" values="50;160;64;120;50" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="95;40;88;60;95" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="745" y="85" width="8" height="70" rx="4"><animate attributeName="height" values="70;180;90;150;70" dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="85;30;75;45;85" dur="1.25s" repeatCount="indefinite"/></rect>
    <rect x="760" y="100" width="8" height="40" rx="4"><animate attributeName="height" values="40;140;52;100;40" dur="1.45s" repeatCount="indefinite"/><animate attributeName="y" values="100;50;94;70;100" dur="1.45s" repeatCount="indefinite"/></rect>
    <rect x="775" y="92" width="8" height="56" rx="4"><animate attributeName="height" values="56;150;70;126;56" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="92;45;85;57;92" dur="1.05s" repeatCount="indefinite"/></rect>
    <rect x="790" y="104" width="8" height="32" rx="4"><animate attributeName="height" values="32;110;40;90;32" dur="1.35s" repeatCount="indefinite"/><animate attributeName="y" values="104;65;100;75;104" dur="1.35s" repeatCount="indefinite"/></rect>
    <rect x="805" y="90" width="8" height="60" rx="4"><animate attributeName="height" values="60;160;76;130;60" dur="1.15s" repeatCount="indefinite"/><animate attributeName="y" values="90;40;82;55;90" dur="1.15s" repeatCount="indefinite"/></rect>
    <rect x="820" y="98" width="8" height="44" rx="4"><animate attributeName="height" values="44;130;56;104;44" dur="1.55s" repeatCount="indefinite"/><animate attributeName="y" values="98;55;92;68;98" dur="1.55s" repeatCount="indefinite"/></rect>
    <rect x="835" y="106" width="8" height="28" rx="4"><animate attributeName="height" values="28;96;34;76;28" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="106;72;103;82;106" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="850" y="96" width="8" height="48" rx="4"><animate attributeName="height" values="48;140;60;110;48" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="96;50;90;65;96" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="865" y="102" width="8" height="36" rx="4"><animate attributeName="height" values="36;110;44;86;36" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="102;65;98;77;102" dur="1.1s" repeatCount="indefinite"/></rect>
    <rect x="880" y="108" width="8" height="24" rx="4"><animate attributeName="height" values="24;76;30;56;24" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="108;82;105;92;108" dur="1.5s" repeatCount="indefinite"/></rect>
    <rect x="895" y="104" width="8" height="32" rx="4"><animate attributeName="height" values="32;90;38;70;32" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="104;75;101;85;104" dur="1.3s" repeatCount="indefinite"/></rect>
    <rect x="910" y="110" width="8" height="20" rx="4"><animate attributeName="height" values="20;60;24;44;20" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="110;90;108;98;110" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="925" y="113" width="8" height="14" rx="4"><animate attributeName="height" values="14;40;18;30;14" dur="1.45s" repeatCount="indefinite"/><animate attributeName="y" values="113;100;111;105;113" dur="1.45s" repeatCount="indefinite"/></rect>
  </g>
</svg>
